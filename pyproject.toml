[project]
name = "cross-vault-seed-sync"
version = "0.1.0"
description = "Verifies the Contexta <-> BrainSync seed-promotion handoff: promoted seeds resolve, BrainSync files aren't orphaned."
readme = "README.md"
authors = [
    { name = "Jamal Hansen", email = "jamal.hansen@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-frontmatter>=1.1.0",
    "typer>=0.24.1",
]

[project.scripts]
seed-sync = "cross_vault_seed_sync.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
]
